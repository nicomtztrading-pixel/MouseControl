<style>

    /* ================================
       CONTADOR DE DESCARGAS
    ================================ */

    .download-counter {
        margin-top: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(190, 115, 255, 0.10);
        border: 1px solid rgba(190, 115, 255, 0.22);
        color: rgba(255, 255, 255, 0.82);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1px;
    }

    .download-counter strong {
        color: #d39aff;
    }


    /* ================================
       BOTÓN SOPORTE CENTRADO
    ================================ */

    .support-button-container {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }


    /* ================================
       VENTANA DE SOPORTE
    ================================ */

    .complaint-modal {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0, 0, 0, 0.72);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    .complaint-modal.active {
        display: flex;
    }

    .complaint-modal-box {
        width: min(520px, 100%);
        position: relative;
        padding: 34px;
        border-radius: 24px;
        background: rgba(20, 14, 30, 0.90);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow:
            0 25px 80px rgba(0, 0, 0, 0.55),
            inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        text-align: center;
    }

    .complaint-modal-box h2 {
        margin: 0;
        font-size: clamp(26px, 5vw, 38px);
    }

    .complaint-text {
        margin: 18px 0 24px;
        color: rgba(255, 255, 255, 0.76);
        line-height: 1.7;
    }

    .complaint-email {
        margin: 24px 0;
        padding: 20px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.055);
        border: 1px solid rgba(255, 255, 255, 0.10);
    }

    .complaint-email span {
        display: block;
        margin-bottom: 8px;
        color: #b777f5;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1px;
    }

    .complaint-email strong {
        display: block;
        font-size: 15px;
        word-break: break-word;
    }

    .complaint-close,
    .weapon-modal-close,
    .payment-close {
        position: absolute;
        top: 14px;
        right: 16px;
        width: 36px;
        height: 36px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        color: white;
        font-size: 20px;
        cursor: pointer;
        transition: 0.2s ease;
    }

    .complaint-close:hover,
    .weapon-modal-close:hover,
    .payment-close:hover {
        background: rgba(255, 255, 255, 0.12);
        transform: translateY(-1px);
    }


    /* =========================================================
       CONFIGURACIONES DE ARMAS
    ========================================================= */

    .weapon-section {
        scroll-margin-top: 110px;
    }

    .weapon-category-title {
        text-align: center;
        margin: 0 0 26px;
    }

    .weapon-category-title h3 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 0.5px;
    }

    .weapon-category-title p {
        margin: 8px 0 0;
        color: rgba(255, 255, 255, 0.62);
        font-size: 13px;
    }

    .weapon-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 16px;
    }

    .weapon-card {
        position: relative;
        overflow: hidden;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.11);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.055);
        color: white;
        cursor: pointer;
        text-align: left;
        font-family: inherit;
        transition:
            transform 0.22s ease,
            border-color 0.22s ease,
            box-shadow 0.22s ease,
            background 0.22s ease;
        appearance: none;
        -webkit-appearance: none;
    }

    .weapon-card:hover {
        transform: translateY(-5px);
        border-color: rgba(190, 115, 255, 0.48);
        background: rgba(190, 115, 255, 0.08);
        box-shadow:
            0 18px 45px rgba(0, 0, 0, 0.32),
            0 0 25px rgba(151, 73, 224, 0.10);
    }

    .weapon-card:focus-visible {
        outline: 2px solid #c16fff;
        outline-offset: 3px;
    }

    .weapon-image {
        width: 100%;
        height: 145px;
        display: block;
        object-fit: cover;
        object-position: center;
        background:
            linear-gradient(
                135deg,
                rgba(190, 115, 255, 0.13),
                rgba(0, 0, 0, 0.35)
            );
    }

    .weapon-card-content {
        padding: 16px;
        text-align: center;
    }

    .weapon-card-content h4 {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0.6px;
    }

    .weapon-card-content span {
        display: block;
        margin-top: 7px;
        color: #b777f5;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 1.2px;
    }


    /* ================================
       MODAL CONFIGURACIÓN DE ARMA
    ================================ */

    .weapon-modal {
        position: fixed;
        inset: 0;
        z-index: 10001;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0, 0, 0, 0.78);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    .weapon-modal.active {
        display: flex;
    }

    .weapon-modal-box {
        width: min(520px, 100%);
        position: relative;
        overflow: hidden;
        border-radius: 24px;
        background: rgba(20, 14, 30, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow:
            0 30px 90px rgba(0, 0, 0, 0.65),
            0 0 45px rgba(151, 73, 224, 0.10),
            inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        text-align: center;
        animation: weaponModalIn 0.2s ease;
    }

    @keyframes weaponModalIn {
        from {
            opacity: 0;
            transform: translateY(12px) scale(0.97);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .weapon-modal-image {
        width: 100%;
        height: 220px;
        display: block;
        object-fit: cover;
        object-position: center;
        background:
            linear-gradient(
                135deg,
                rgba(190, 115, 255, 0.14),
                rgba(0, 0, 0, 0.40)
            );
    }

    .weapon-modal-content {
        padding: 28px;
    }

    .weapon-modal-content .section-tag {
        margin-bottom: 8px;
    }

    .weapon-modal-content h2 {
        margin: 0;
        font-size: clamp(28px, 5vw, 38px);
    }

    .weapon-modal-description {
        margin: 9px 0 22px;
        color: rgba(255, 255, 255, 0.58);
        font-size: 12px;
    }

    .weapon-values {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        margin-top: 20px;
    }

    .weapon-value {
        padding: 20px 15px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.055);
        border: 1px solid rgba(255, 255, 255, 0.10);
    }

    .weapon-value span {
        display: block;
        margin-bottom: 8px;
        color: #b777f5;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1.4px;
    }

    .weapon-value strong {
        display: block;
        font-size: 30px;
        font-weight: 900;
    }

    .weapon-modal-note {
        margin: 18px 0 0;
        color: rgba(255, 255, 255, 0.48);
        font-size: 10px;
    }


    /* =========================================================
       SOLO PARA LOS DOS VIDEOS PRINCIPALES
    ========================================================= */

    .main-videos {
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
    }

    .main-video-card {
        min-width: 0;
        text-align: center;
    }

    .main-video-card .video-container {
        width: 100%;
        max-width: none;
        margin: 0 auto;
    }

    .main-video-card .video-container iframe {
        width: 100%;
        aspect-ratio: 16 / 9;
        display: block;
    }

    .main-video-title {
        margin: 0 0 12px;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.5px;
    }

    .main-video-description {
        margin: 0 0 16px;
        color: rgba(255, 255, 255, 0.68);
        font-size: 13px;
        line-height: 1.5;
    }

    .main-video-button {
        margin-top: 16px;
        width: 100%;
    }


    /* ================================
       VIDEO INDIVIDUAL HACKAIM
    ================================ */

    .hackaim-how-video {
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
    }

    .hackaim-how-video iframe {
        width: 100%;
        aspect-ratio: 16 / 9;
        display: block;
    }


    /* ================================
       PRECIOS
    ================================ */

    .pricing-products {
        display: grid;
        gap: 30px;
    }

    .pricing-product {
        width: 100%;
    }

    .pricing-product-title {
        text-align: center;
        margin: 0 0 20px;
    }

    .pricing-product-title .section-tag {
        margin-bottom: 8px;
    }

    .pricing-product-title h3 {
        margin: 0;
        font-size: 26px;
    }

    .pricing-product-title p {
        margin: 8px 0 0;
        color: rgba(255, 255, 255, 0.65);
    }

    .pricing-product .pricing {
        margin-top: 0;
    }

    .payment-methods-note {
        margin: 18px 0 0;
        text-align: center;
        color: rgba(255, 255, 255, 0.62);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.7px;
    }

    .payment-methods-note strong {
        color: #d39aff;
    }


    /* ================================
       BOTONES DE COMPRA
    ================================ */

    .buy-license-button {
        width: 100%;
        border: none;
        cursor: pointer;
        font-family: inherit;
    }


    /* ================================
       MODAL DE PAGO
    ================================ */

    .payment-modal {
        position: fixed;
        inset: 0;
        z-index: 12000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0, 0, 0, 0.78);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    .payment-modal.active {
        display: flex;
    }

    .payment-modal-box {
        width: min(500px, 100%);
        position: relative;
        padding: 34px;
        border-radius: 24px;
        background: rgba(20, 14, 30, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow:
            0 30px 90px rgba(0, 0, 0, 0.65),
            0 0 45px rgba(151, 73, 224, 0.12),
            inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        text-align: center;
        animation: paymentModalIn 0.2s ease;
    }

    @keyframes paymentModalIn {
        from {
            opacity: 0;
            transform: translateY(12px) scale(0.97);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .payment-modal-box h2 {
        margin: 0;
        font-size: clamp(26px, 5vw, 36px);
    }

    .payment-modal-description {
        margin: 12px 0 24px;
        color: rgba(255, 255, 255, 0.64);
        line-height: 1.6;
        font-size: 13px;
    }

    .payment-product-name {
        margin-bottom: 22px;
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(190, 115, 255, 0.08);
        border: 1px solid rgba(190, 115, 255, 0.20);
        color: #d39aff;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.6px;
    }

    .payment-form {
        display: grid;
        gap: 14px;
        text-align: left;
    }

    .payment-field {
        display: grid;
        gap: 7px;
    }

    .payment-field label {
        color: rgba(255, 255, 255, 0.72);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.8px;
    }

    .payment-field input {
        width: 100%;
        padding: 14px 15px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.055);
        color: white;
        outline: none;
        font-family: inherit;
        font-size: 14px;
        transition: 0.2s ease;
    }

    .payment-field input:focus {
        border-color: rgba(190, 115, 255, 0.60);
        box-shadow: 0 0 0 3px rgba(190, 115, 255, 0.10);
    }

    .payment-error {
        min-height: 18px;
        color: #ff8f8f;
        font-size: 11px;
        line-height: 1.5;
    }

    .payment-submit {
        width: 100%;
        border: none;
        cursor: pointer;
    }

    .payment-submit:disabled {
        opacity: 0.65;
        cursor: wait;
    }


    /* ================================
       BOTÓN FLOTANTE WHATSAPP
    ================================ */

    .whatsapp-floating {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 11000;

        display: flex;
        align-items: center;
        gap: 10px;

        padding: 13px 18px;
        border-radius: 999px;

        background: #25D366;
        color: #ffffff;

        text-decoration: none;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.3px;

        box-shadow:
            0 12px 35px rgba(0, 0, 0, 0.35),
            0 0 25px rgba(37, 211, 102, 0.22);

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    .whatsapp-floating:hover {
        transform: translateY(-3px);
        box-shadow:
            0 16px 40px rgba(0, 0, 0, 0.42),
            0 0 30px rgba(37, 211, 102, 0.30);
    }

    .whatsapp-floating:active {
        transform: translateY(-1px);
    }

    .whatsapp-icon {
        width: 25px;
        height: 25px;
        flex-shrink: 0;
        display: block;
    }
